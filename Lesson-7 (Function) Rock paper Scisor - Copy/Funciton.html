<!DOCTYPE html>
<html>

<head>
    <title>Stone Paper Scissors</title>
</head>

<body>

    <h1>Stone Paper Scissors Game</h1>
    <hr>

    <button onclick="playerMove('stone')">Stone</button>
    <button onclick="playerMove('paper')">Paper</button>
    <button onclick="playerMove('scissor')">Scissor</button>
    <button onclick="playerMove('reset')">Reset</button>

    <script>

        const score = {
            win: 0,
            lose: 0,
            tie: 0
        };

        function playerMove(player) {

            // Reset Logic
            if (player === 'reset') {

                score.win = 0;
                score.lose = 0;
                score.tie = 0;

                alert(`Score Reset Successfully!
Win: ${score.win}, Lose: ${score.lose}, Tie: ${score.tie}`);

                return;
            }

            let randomNumber = Math.random();
            let computerMove;

            if (randomNumber < 1 / 3) {
                computerMove = 'stone';
            }
            else if (randomNumber < 2 / 3) {
                computerMove = 'paper';
            }
            else {
                computerMove = 'scissor';
            }

            if (computerMove === player) {

                score.tie += 1;

                alert(`Game Tie!
You: ${player}, Computer: ${computerMove}
Win: ${score.win}, Lose: ${score.lose}, Tie: ${score.tie}`);

            }
            else if (
                (computerMove === 'scissor' && player === 'paper') ||
                (computerMove === 'paper' && player === 'stone') ||
                (computerMove === 'stone' && player === 'scissor')
            ) {

                score.win += 1;

                alert(`You Won!
You: ${player}, Computer: ${computerMove}
Win: ${score.win}, Lose: ${score.lose}, Tie: ${score.tie}`);

            }
            else {

                score.lose += 1;

                alert(`You Lost!
You: ${player}, Computer: ${computerMove}
Win: ${score.win}, Lose: ${score.lose}, Tie: ${score.tie}`);

            }

        }

    </script>

</body>

</html>
