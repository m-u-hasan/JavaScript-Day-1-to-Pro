<html>

<head>

</head>

<body>

    <h1>Stone paper Scissors Game</h1>
    <hr>

    <button onclick="playerMove ('stone')">Stone</button>
    <button onclick="playerMove ('paper')">Paper</button>
    <button onclick="playerMove ('scissor')">Scissor</button>
    <button onclick="playerMove ('reset')">Reset</button>


    <script>
        const score = {
            win: 0,
            lose: 0,
            tie: 0
        };

        function playerMove(player) {
            let randomNumber, computerMove;

            randomNumber = Math.random();
            if (randomNumber < 1 / 3) {
                computerMove = 'stone';
            }
            else if (randomNumber < 2 / 3) {
                computerMove = 'paper';
            }
            else {
                computerMove = 'scissor'
            }
            if (computerMove === player) {
                score.tie += 1;
                alert(`You Move ${player}, and computer move ${computerMove}. Result: Game Tie \n Score is: Win: ${score.win}, Lose: ${score.lose}, Tie: ${score.tie}`);
            }
            else if ((computerMove === 'scissor' && player === 'paper') ||
                (computerMove === 'paper' && player === 'stone') ||
                (computerMove === 'stone' && player === 'scissor')) {
                score.win += 1;
                alert(`You Move ${player}, and computer move ${computerMove}. Result: Computer Won the Game \n Score is: Win: ${score.win}, Lose: ${score.lose}, Tie: ${score.tie}`);
            }
            else if (player === 'reset') {
                score.win = 0;
                score.lose = 0;
                score.tie = 0;
                alert(`You Click on:  ${player}. So, Reset all of score. Win: ${score.win}, Lose: ${score.lose}, Tie: ${score.tie}`);
            }
            else {
                score.lose += 1;
                alert(`You Move ${player}, and computer move ${computerMove}. Result: You Won the Game \n Score is: Win: ${score.win}, Lose: ${score.lose}, Tie: ${score.tie}`);
            }

        }

    </script>


</body>

</html>
